<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CV/CB Spectrum · Screen</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{--b:#0667ad;--c:#13b5d7;--g:#78bf1f;--ink:#17212b;--line:#dce4ea}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif;color:var(--ink);background:#0a1628;overflow:hidden}
.bar{height:8px;background:linear-gradient(90deg,var(--b),var(--c),var(--g))}
.wrap{padding:30px 48px;height:calc(100vh - 8px);display:flex;flex-direction:column}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.title{font-size:36px;font-weight:900;color:white}
.session{font-size:18px;color:#8899aa;font-weight:700;letter-spacing:3px}
.panel{background:rgba(255,255,255,.06);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:24px;flex:1;overflow:auto}
.teams{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.team{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px;text-align:center;color:white}
.team-name{font-size:20px;font-weight:700;color:var(--c)}
.team b{font-size:36px;display:block;margin:4px 0}
.team small{font-size:14px;color:#8899aa}
.total-bar{display:flex;justify-content:center;align-items:center;gap:30px;margin-top:16px;color:white;font-size:20px}
.total-bar b{font-size:28px;color:var(--c)}
.round-header{text-align:center;margin-bottom:16px}
.pill{display:inline-block;padding:6px 16px;border-radius:999px;background:rgba(19,181,215,.15);color:var(--c);font-weight:800;font-size:16px}
.value-name{font-size:42px;font-weight:900;color:white;margin:10px 0}
.axis-bar{display:flex;justify-content:space-between;align-items:center;max-width:800px;margin:8px auto;color:#8899aa;font-size:18px;font-weight:700}
.axis-bar .num{color:var(--c);font-size:22px;font-weight:900;min-width:40px;text-align:center}
.clue{font-size:36px;font-weight:900;text-align:center;background:rgba(19,181,215,.1);border:1px solid rgba(19,181,215,.2);border-radius:16px;padding:20px;margin:16px auto;color:white;max-width:800px}
.status{text-align:center;font-size:22px;color:var(--c);margin:12px 0;font-weight:700}
.spectrum{max-width:800px;margin:16px auto;position:relative}
.spectrum-bar{height:16px;border-radius:8px;background:linear-gradient(90deg,var(--b),var(--c),var(--g));position:relative}
.target-marker{position:absolute;top:-8px;width:4px;height:32px;background:#ff6b6b;border-radius:2px;transform:translateX(-50%)}
.target-label{position:absolute;top:-32px;transform:translateX(-50%);color:#ff6b6b;font-weight:900;font-size:16px}
.results{width:100%;border-collapse:collapse;font-size:20px;color:white}
.results td,.results th{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.results th{color:#8899aa;font-weight:600;font-size:16px}
.results th:first-child,.results td:first-child{text-align:left}
.results tr:nth-child(1) td{color:#ffd700}
.results tr:nth-child(2) td{color:#c0c0c0}
.results tr:nth-child(3) td{color:#cd7f32}
.rank-medal{font-size:24px}
.scoreboard{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:12px}
.score-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px;text-align:center;color:white}
.score-card.gold{border-color:#ffd700;background:rgba(255,215,0,.08)}
.score-rank{font-size:14px;color:#8899aa;font-weight:700}
.score-name{font-size:18px;font-weight:800;margin:4px 0;color:var(--c)}
.score-pts{font-size:30px;font-weight:900}
.hidden{display:none}
</style>
</head>
<body>
<div class="bar"></div>
<div class="wrap">
  <div class="header">
    <div class="title">CV/CB Spectrum</div>
    <div class="session" id="code"></div>
  </div>
  <div class="panel">
    <div id="lobby">
      <div class="total-bar"><span>참가자</span> <b id="totalCount">0</b><span>명 접속 중</span></div>
      <div id="teams" class="teams" style="margin-top:16px"></div>
      <div style="text-align:center;margin-top:20px">
        <div id="scoreboard" class="scoreboard"></div>
      </div>
    </div>
    <div id="round" class="hidden">
      <div class="round-header">
        <span id="group" class="pill"></span>
        <div id="value" class="value-name"></div>
        <div class="axis-bar">
          <span class="num">0</span>
          <span id="left"></span>
          <span style="color:#556;font-size:14px">← 스펙트럼 →</span>
          <span id="right"></span>
          <span class="num">100</span>
        </div>
      </div>
      <div id="clue" class="clue hidden"></div>
      <div id="statusLine" class="status"></div>
      <div id="spectrumViz" class="spectrum hidden">
        <div class="spectrum-bar">
          <div id="targetMarker" class="target-marker"><span id="targetLabel" class="target-label"></span></div>
        </div>
      </div>
      <div id="result"></div>
    </div>
  </div>
</div>
<script>
const socket=io({reconnection:true,reconnectionAttempts:Infinity,reconnectionDelay:1000}),
      q=new URLSearchParams(location.search),
      code=(q.get("code")||"").toUpperCase(),
      $=id=>document.getElementById(id),
      show=(id,on=true)=>$(id).classList.toggle("hidden",!on);

$("code").textContent=code;
socket.emit("screenJoin",{code},res=>{if(res?.ok)apply(res.state)});
socket.on("connect",()=>socket.emit("screenJoin",{code},res=>{if(res?.ok)apply(res.state)}));
socket.on("screenState",apply);
socket.on("result",renderResult);

function apply(s){
  const connected=s.participants.filter(p=>p.connected);
  $("totalCount").textContent=connected.length;
  $("teams").innerHTML=s.teams.map(t=>{
    const n=connected.filter(p=>p.team===t).length;
    return `<div class="team"><div class="team-name">${t}</div><b>${n}</b><small>누적 ${s.teamScores[t]||0}점</small></div>`;
  }).join("");
  show("lobby",s.phase==="lobby"||!s.currentRound);
  show("round",s.phase!=="lobby"&&!!s.currentRound);
  if(s.currentRound){
    $("group").textContent=s.currentRound.group;
    $("value").textContent=s.currentRound.value;
    $("left").textContent=s.currentRound.left;
    $("right").textContent=s.currentRound.right;
    show("clue",!!s.clue); $("clue").textContent=s.clue?`"${s.clue}"`:"";
    $("statusLine").textContent=
      s.phase==="clue"?"🎤 진행자가 힌트를 준비하고 있습니다...":
      s.phase==="voting"?`📊 투표 진행 중 · ${s.voteCount}명 참여`:"";
    if(s.phase!=="revealed"){$("result").innerHTML="";show("spectrumViz",false)}
  }
  renderScoreboard(s);
}

function renderResult(r){
  show("spectrumViz",true);
  $("targetMarker").style.left=r.target+"%";
  $("targetLabel").textContent="Target "+r.target;
  const rows=[...r.teamResults].sort((a,b)=>(a.distance??999)-(b.distance??999));
  const medals=["🥇","🥈","🥉"];
  $("result").innerHTML=`
    <div style="text-align:center;margin:12px 0"><span style="font-size:28px;color:#ff6b6b;font-weight:900">🎯 Target: ${r.target}</span></div>
    <table class="results">
      <tr><th></th><th>조</th><th>참여</th><th>조 평균</th><th>거리</th><th>점수</th></tr>
      ${rows.map((x,i)=>`<tr>
        <td class="rank-medal">${x.count?(medals[i]||i+1):'-'}</td>
        <td>${x.team}</td>
        <td>${x.count}명</td>
        <td>${x.avg==null?'-':x.avg.toFixed(1)}</td>
        <td>${x.distance==null?'-':x.distance.toFixed(1)}</td>
        <td style="font-weight:900;font-size:24px">+${x.points}</td>
      </tr>`).join("")}
    </table>`;
  $("statusLine").textContent="";
}

function renderScoreboard(s){
  const sorted=Object.entries(s.teamScores).sort((a,b)=>b[1]-a[1]);
  $("scoreboard").innerHTML=sorted.map(([t,pts],i)=>
    `<div class="score-card ${i===0&&pts>0?'gold':''}"><div class="score-rank">#${i+1}</div><div class="score-name">${t}</div><div class="score-pts">${pts}</div></div>`
  ).join("");
}
</script>
</body>
</html>
